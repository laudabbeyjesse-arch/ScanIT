<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ScanIT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #2e7d32;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">📊 Admin Dashboard</div>
    <div class="slogan">View Contact Form Submissions</div>
  </header>

  <section>
    <h2>📨 Messages</h2>
    <table id="messagesTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Firebase + Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } 
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCi-Fb3VVwKri-rJWfGu3nEsrOG2VR8ncI",
      authDomain: "scanit-c0e54.firebaseapp.com",
      projectId: "scanit-c0e54",
      storageBucket: "scanit-c0e54.firebasestorage.app",
      messagingSenderId: "378715760777",
      appId: "1:378715760777:web:346d3998e4f379b9763e58",
      measurementId: "G-GY03JV4CP1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadMessages() {
      const tableBody = document.querySelector("#messagesTable tbody");
      tableBody.innerHTML = "";

      const q = query(collection(db, "messages"), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);

      snapshot.forEach(doc => {
        const data = doc.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${data.name}</td>
          <td>${data.email}</td>
          <td>${data.message}</td>
          <td>${data.timestamp ? data.timestamp.toDate().toLocaleString() : ""}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    loadMessages();
  </script>
</body>
</html>
